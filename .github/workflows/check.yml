name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --lib --examples --bins --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo package -p lonk --locked
      - run: cargo run -p lonk --example embed --locked
      - name: Run language examples
        run: |
          cargo build -p lonk-cli --locked
          for source in examples/*.lonk; do
            target/debug/lonk eval "$source" > /dev/null
            target/debug/lonk fmt --check "$source"
          done

  editors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Generate, test and load the parser
        run: |
          nix develop --no-update-lock-file --command bash -euo pipefail -c '
            make -C editors/tree-sitter-lonk generate test nvim
            git diff --exit-code -- editors/tree-sitter-lonk/src/parser.c editors/tree-sitter-lonk/src/grammar.json editors/tree-sitter-lonk/src/tree_sitter/parser.h
            nvim --headless --clean --cmd "set runtimepath+=./editors/nvim" examples/collections.lonk \
              -c "lua local ok, err = pcall(function() assert(vim.bo.filetype == [[lonk]]); assert(not vim.treesitter.get_parser(0):parse()[1]:root():has_error()); assert(vim.treesitter.query.get([[lonk]], [[highlights]])); assert(vim.treesitter.query.get([[lonk]], [[locals]])); vim.cmd([[setfiletype text]]) end); if not ok then print(err); vim.cmd([[cquit 1]]) end" \
              -c "qa!"
          '
